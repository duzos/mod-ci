name: Dev build

# Builds each target and posts the resulting jar to a Discord webhook.
#
# Push-triggered only in practice: the upload message is built from the pushed
# commit, so a manual dispatch has nothing to read. Callers should not offer a
# workflow_dispatch that cannot work.
#
# Targets take the same shape as publish.yml's, so a caller can pass one value
# to both.

on:
  workflow_call:
    inputs:
      targets:
        description: 'JSON array of {project?, datagen?} objects. Default is one root-project build.'
        type: string
        required: false
        default: '[{}]'
      java:
        type: string
        required: false
        default: '21'
      avatar:
        description: 'Webhook avatar URL. Defaults to the README logo, then the owner avatar.'
        type: string
        required: false
        default: ''

jobs:
  devbuild:
    # Without this the job title is every matrix value joined together.
    name: ${{ matrix.target.project || 'root' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK ${{ inputs.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Resolve gradle paths
        id: g
        run: |
          set -euo pipefail
          p='${{ matrix.target.project }}'
          if [ -z "$p" ] || [ "$p" = "." ]; then
            echo "dir=."    >> "$GITHUB_OUTPUT"
            echo "label="   >> "$GITHUB_OUTPUT"
          else
            echo "dir=$p"   >> "$GITHUB_OUTPUT"
            echo "label=$p" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore DataGen cache
        if: matrix.target.datagen
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.g.outputs.dir }}/src/generated
          key: datagen-${{ matrix.target.project }}-${{ github.run_id }}
          restore-keys: datagen-${{ matrix.target.project }}-

      - name: Run DataGen
        if: matrix.target.datagen
        run: ./gradlew -p ${{ steps.g.outputs.dir }} Data
        continue-on-error: true

      - name: Save DataGen cache
        if: matrix.target.datagen
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.g.outputs.dir }}/src/generated
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}

      - name: Build ${{ steps.g.outputs.dir }}
        run: ./gradlew -p ${{ steps.g.outputs.dir }} build

      - name: Publish ${{ steps.g.outputs.dir }} artifacts
        env:
          WEBHOOK: ${{ secrets.DEV_BUILDS }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          DIR: ${{ steps.g.outputs.dir }}
          LABEL: ${{ steps.g.outputs.label }}
          AVATAR: ${{ inputs.avatar }}
        run: |
          set -euo pipefail

          jar=$(ls "$DIR"/build/libs/*.jar | grep -vE -- '-(sources|dev|javadoc)[.]jar$' | head -1)
          test -n "$jar" || { echo "no jar in $DIR/build/libs"; exit 1; }
          echo "uploading $jar ($(du -h "$jar" | cut -f1))"

          # "<repo>/<module> builds", or just "<repo> builds" for a root build.
          name="${REPO#*/}"
          if [ -n "$LABEL" ]; then name="$name/$LABEL"; fi
          name="$name builds"

          # Avatar: the explicit input, else the first repo-relative image in
          # the README, else the owner avatar. Empty posts without one.
          avatar="$AVATAR"
          if [ -z "$avatar" ] && [ -f README.md ]; then
            rel=$(grep -oE '<img[^>]+src="[^"]+"|!\[[^]]*\]\([^) ]+' README.md \
              | sed -E 's/.*src="([^"]+)".*/\1/; s/^!\[[^]]*\]\(//' \
              | grep -vE '^(https?:)?//|^data:' | head -1 | sed 's|^\./||') || true
            if [ -n "$rel" ]; then
              cand="https://raw.githubusercontent.com/$REPO/$SHA/$rel"
              curl -sfI --max-time 15 -o /dev/null "$cand" && avatar="$cand" || true
            fi
          fi
          if [ -z "$avatar" ]; then
            cand="https://github.com/${REPO%%/*}.png"
            curl -sfI --max-time 15 -o /dev/null "$cand" && avatar="$cand" || true
          fi
          echo "avatar: ${avatar:-<none>}"

          payload=$(jq -nc \
            --arg u "$name" \
            --arg a "$avatar" \
            --arg repo "$REPO" \
            --arg run "$RUN_NUMBER" \
            --arg m "$COMMIT_MSG" \
            --arg url "$COMMIT_URL" \
            '{username: $u, content: ("<:new1:1253371736510959636><:new2:1253371805734015006> New `\($repo)` dev build `#\($run)`:\n> :sparkles: [\($m)](<\($url)>)")}
             | if $a == "" then . else . + {avatar_url: $a} end')

          # --form-string, not -F: curl reads ';' in an -F value as a parameter
          # separator, so a commit message containing one truncates the JSON and
          # Discord rejects the request with a 400.
          curl -sS --fail-with-body -X POST "$WEBHOOK" \
            --form-string "payload_json=$payload" \
            -F "files[0]=@$jar"
